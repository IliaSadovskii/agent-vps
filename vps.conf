# Настройки этого сервера. Правишь здесь — применяешь `bash init.sh`.

# Язык, на котором агенты этого сервера разговаривают с тобой.
#
# Указывай код (ru, en) или название языка по-английски (Spanish, Japanese) —
# для второго варианта директива будет на английском, модель это понимает.
# Документы репозитория остаются русскими независимо от этой настройки: язык
# ответа задаётся явно, а не тем, на каком языке написаны правила.
#
# Изменение действует на сессии, открытые ПОСЛЕ применения: файл с правилами
# читается один раз при старте. Уже открытые — переоткрой (claude-close <имя>
# → claude-project <имя>), или просто попроси агента отвечать иначе.
AGENT_LANG=ru

# Плагины Claude Code, общие для ВСЕХ сессий этого сервера.
#
# Формат записи: плагин@маркетплейс=владелец/репозиторий, записи через пробел.
# Ставятся на уровень пользователя, поэтому действуют и в управляющей сессии,
# и в проектных. Уже открытые сессии переоткрой — плагины читаются при старте.
#
# caveman — заставляет агента отвечать коротко, без вводных и повторов
# (github.com/JuliusBrussee/caveman). Убрать — очисти строку или удали запись;
# выключить на время, не трогая конфиг, — `claude plugin disable caveman@caveman`.
AGENT_PLUGINS="caveman@caveman=JuliusBrussee/caveman"
